apiVersion: v1
kind: Namespace
metadata:
  name: hotel
---
apiVersion: v1
kind: Service
metadata:
  name: oracle-db
  namespace: hotel
spec:
  clusterIP: None
  selector:
    app: oracle-db
  ports:
    - port: 1521
      targetPort: 1521
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oracle
  namespace: hotel
spec:
  serviceName: oracle-db
  replicas: 1
  selector:
    matchLabels:
      app: oracle-db
  template:
    metadata:
      labels:
        app: oracle-db
    spec:
      containers:
        - name: oracle
          image: container-registry.oracle.com/database/free:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1521
          env:
            - name: ORACLE_PWD
              valueFrom:
                secretKeyRef:
                  name: oracle-secret
                  key: ORACLE_PWD
          resources:
            requests:
              memory: "2Gi"
            limits:
              memory: "4Gi"
          volumeMounts:
            - name: oradata
              mountPath: /opt/oracle/oradata
  volumeClaimTemplates:
    - metadata:
        name: oradata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi